# documentation: https://docs.openreplay.com/
# slogan: OpenReplay is an open-source session replay suite that lets you see what users do on your web app, helping you troubleshoot issues faster.
# tags: analytics,session-replay,monitoring,debugging,user-experience
# category: analytics
# logo: svgs/openreplay.png
# port: 8080

services:
  # ===== Infrastructure =====
  postgresql:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_USER=${SERVICE_USER_POSTGRES:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - openreplay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    volumes:
      - openreplay-clickhouse:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE:-}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - openreplay-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    volumes:
      - openreplay-miniodata:/data
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    command: server /data

  # ===== Database Initialization Service =====
  init-db:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      - PGHOST=postgresql
      - PGUSER=${SERVICE_USER_POSTGRES:-postgres}
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=${POSTGRES_DB:-postgres}
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${SERVICE_PASSWORD_CLICKHOUSE:-}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /bin/sh -c "
      apk add --no-cache postgresql-client curl &&
      echo 'Waiting for Postgres...' &&
      until pg_isready; do sleep 1; done &&
      echo 'Postgres is ready. Downloading schema...' &&
      curl -sL https://raw.githubusercontent.com/openreplay/openreplay/main/scripts/schema/db/init_dbs/postgresql/init_schema.sql -o pg_init.sql &&
      echo 'Running Postgres init...' &&
      psql -f pg_init.sql &&
      echo 'Waiting for ClickHouse...' &&
      until clickhouse-client --host=\$CLICKHOUSE_HOST --query='SELECT 1'; do sleep 1; done &&
      echo 'ClickHouse is ready. Downloading schema...' &&
      curl -sL https://raw.githubusercontent.com/openreplay/openreplay/main/scripts/schema/db/init_dbs/clickhouse/create/init_schema.sql -o ch_init.sql &&
      echo 'Running ClickHouse init...' &&
      clickhouse-client --host=\$CLICKHOUSE_HOST --user=\$CLICKHOUSE_USER --password=\"\$CLICKHOUSE_PASSWORD\" --multiquery < ch_init.sql &&
      echo 'Init complete.'
      "
    depends_on:
      postgresql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  # ===== Data Consumer Service =====
  db:
    image: samuel21dafe/openreplay-db:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - CLICKHOUSE_STRING=clickhouse:9000/default
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  # ===== Go Backend Services =====
  api:
    image: samuel21dafe/openreplay-api:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - SERVICE_URL_API_8080=/api
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - CLICKHOUSE_STRING=clickhouse:9000/default
      - CLICKHOUSE_HTTP_STRING=clickhouse:8123/default
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - JWT_SPOT_SECRET=${SERVICE_PASSWORD_64_JWTSPOT}
      - ASSIST_URL=http://assist:9001/assist/%s
      - ASSIST_KEY=${SERVICE_PASSWORD_64_ASSISTKEY}
      - ASSIST_JWT_SECRET=${SERVICE_PASSWORD_64_ASSISTJWT}
      - TOKEN_SECRET=${SERVICE_PASSWORD_64_TOKEN}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  http:
    image: samuel21dafe/openreplay-http:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - SERVICE_URL_HTTP_8080=/ingest
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - JWT_SPOT_SECRET=${SERVICE_PASSWORD_64_JWTSPOT}
      - TOKEN_SECRET=${SERVICE_PASSWORD_64_TOKEN}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  sink:
    image: samuel21dafe/openreplay-sink:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - REDIS_STRING=redis://redis:6379
      - ASSETS_ORIGIN=http://minio:9000/${ASSETS_BUCKET:-assets-openreplay}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  ender:
    image: samuel21dafe/openreplay-ender:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  assets:
    image: samuel21dafe/openreplay-assets:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - SERVICE_URL_ASSETS_8080=/assets
      - REDIS_STRING=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ASSETS_ORIGIN=http://minio:9000/${ASSETS_BUCKET:-assets-openreplay}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  images:
    image: samuel21dafe/openreplay-images:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  storage:
    image: samuel21dafe/openreplay-storage:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  sourcemapreader:
    image: samuel21dafe/openreplay-sourcemapreader:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  spot:
    image: samuel21dafe/openreplay-spot:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  canvases:
    image: samuel21dafe/openreplay-canvases:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://minio:9000
      - AWS_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  integrations:
    image: samuel21dafe/openreplay-integrations:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - POSTGRES_STRING=postgres://${SERVICE_USER_POSTGRES:-postgres}:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  heuristics:
    image: samuel21dafe/openreplay-heuristics:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - REDIS_STRING=redis://redis:6379
      - KAFKA_USE_SSL=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  # ===== Python Services =====
  frontend:
    image: samuel21dafe/openreplay-frontend:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - SERVICE_URL_FRONTEND_8080
    depends_on:
      init-db:
        condition: service_completed_successfully

  alerts:
    image: samuel21dafe/openreplay-alerts:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - pg_host=postgresql
      - pg_port=5432
      - pg_user=${SERVICE_USER_POSTGRES:-postgres}
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - pg_dbname=${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - S3_HOST=http://minio:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - ch_host=clickhouse
      - ch_port=9000
      - ch_username=${CLICKHOUSE_USER:-default}
      - ch_password=${SERVICE_PASSWORD_CLICKHOUSE:-}
      - SITE_URL=${SERVICE_FQDN_FRONTEND}
    depends_on:
      init-db:
        condition: service_completed_successfully

  chalice:
    image: samuel21dafe/openreplay-chalice:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - pg_host=postgresql
      - pg_port=5432
      - pg_user=${SERVICE_USER_POSTGRES:-postgres}
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - pg_dbname=${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - S3_HOST=http://minio:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - ch_host=clickhouse
      - ch_port=9000
      - ch_port_http=8123
      - ch_username=${CLICKHOUSE_USER:-default}
      - ch_password=${SERVICE_PASSWORD_CLICKHOUSE:-}
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - JWT_SPOT_SECRET=${SERVICE_PASSWORD_64_JWTSPOT}
      - JWT_REFRESH_SECRET=${SERVICE_PASSWORD_64_JWTREFRESH}
      - JWT_SPOT_REFRESH_SECRET=${SERVICE_PASSWORD_64_JWTSPOTREFRESH}
      - ASSIST_KEY=${SERVICE_PASSWORD_64_ASSISTKEY}
      - ASSIST_JWT_SECRET=${SERVICE_PASSWORD_64_ASSISTJWT}
      - SITE_URL=${SERVICE_FQDN_FRONTEND}
      - sourcemaps_reader=http://sourcemapreader:9000
      - ASSIST_URL=http://assist:9001/assist/%s
      - CH_COMPRESSION=false
    depends_on:
      init-db:
        condition: service_completed_successfully

  assist:
    image: samuel21dafe/openreplay-assist:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - SERVICE_URL_ASSIST_9001=/ws-assist
      - pg_host=postgresql
      - pg_port=5432
      - pg_user=${SERVICE_USER_POSTGRES:-postgres}
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - pg_dbname=${POSTGRES_DB:-postgres}
      - REDIS_STRING=redis://redis:6379
      - ASSIST_KEY=${SERVICE_PASSWORD_64_ASSISTKEY}
      - ASSIST_JWT_SECRET=${SERVICE_PASSWORD_64_ASSISTJWT}
    depends_on:
      init-db:
        condition: service_completed_successfully

volumes:
  openreplay-pgdata:
  openreplay-clickhouse:
  openreplay-redisdata:
  openreplay-miniodata:
  openreplay-shared:
