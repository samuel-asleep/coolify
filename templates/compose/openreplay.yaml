      - MINIO_ACCESS_KEY=${SERVICE_USER_MINIO}
      - MINIO_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
    depends_on:
      - frontend

  assets:
    image: public.ecr.aws/p1t3u8a3/assets:v1.25.0
    volumes:
