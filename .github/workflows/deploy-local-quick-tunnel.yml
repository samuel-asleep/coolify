name: Deploy with Local Services and Quick Tunnel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'copilot/fix-dockerfile-errors'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: coolify
          POSTGRES_USER: coolify
          POSTGRES_PASSWORD: coolify_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      
      - name: Verify services are ready
        run: |
          echo "🔍 Checking PostgreSQL..."
          until pg_isready -h localhost -p 5432 -U coolify; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is ready!"
          
          echo ""
          echo "🔍 Checking Redis..."
          until redis-cli -h localhost -p 6379 ping; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "✅ Redis is ready!"
      
      - name: Generate APP_KEY
        id: generate-key
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          echo "app_key=$APP_KEY" >> $GITHUB_OUTPUT
      
      - name: Create .env file with local services
        run: |
          cat > .env.production.custom << EOF
          # Application Configuration
          APP_ENV=production
          APP_NAME=Coolify
          APP_ID=production
          APP_KEY=${{ steps.generate-key.outputs.app_key }}
          APP_URL=http://localhost:8000
          APP_PORT=8000
          APP_DEBUG=false
          SSH_MUX_ENABLED=true
          
          # Database Configuration - Local PostgreSQL
          # GitHub Actions services are accessible via localhost from the runner
          # But Docker containers need to use host.docker.internal
          DATABASE_URL=postgresql://coolify:coolify_password@localhost:5432/coolify
          DB_CONNECTION=pgsql
          DB_HOST=localhost
          DB_PORT=5432
          DB_DATABASE=coolify
          DB_USERNAME=coolify
          DB_PASSWORD=coolify_password
          
          # Redis Configuration - Local Redis
          REDIS_URL=redis://localhost:6379
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_PASSWORD=
          
          # Queue Configuration
          QUEUE_CONNECTION=redis
          
          # Pusher/Soketi Configuration (for real-time features)
          PUSHER_APP_ID=coolify-app-id
          PUSHER_APP_KEY=coolify-app-key
          PUSHER_APP_SECRET=coolify-app-secret
          SOKETI_DEBUG=false
          SOKETI_PORT=6001
          SOKETI_DEFAULT_APP_ID=coolify-app-id
          SOKETI_DEFAULT_APP_KEY=coolify-app-key
          SOKETI_DEFAULT_APP_SECRET=coolify-app-secret
          
          # Session & Cache Configuration
          SESSION_DRIVER=redis
          CACHE_DRIVER=redis
          
          # Mail Configuration
          MAIL_MAILER=log
          MAIL_FROM_ADDRESS=hello@coolify.io
          MAIL_FROM_NAME=Coolify
          
          # Registry Configuration
          REGISTRY_URL=ghcr.io
          
          # PHP Configuration
          PHP_MEMORY_LIMIT=256M
          PHP_FPM_PM_CONTROL=dynamic
          PHP_FPM_PM_START_SERVERS=1
          PHP_FPM_PM_MIN_SPARE_SERVERS=1
          PHP_FPM_PM_MAX_SPARE_SERVERS=10
          EOF
          
          echo "✅ Created .env.production.custom with local database and Redis"
      
      - name: Build Docker image
        run: |
          docker compose -f docker-compose.external.yml build
      
      - name: Start Coolify services
        run: |
          docker compose -f docker-compose.external.yml up -d
          echo "Waiting for services to start..."
          sleep 30
      
      - name: Check service health
        run: |
          docker compose -f docker-compose.external.yml ps
          
          # Wait for health checks
          echo "Checking Coolify health..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "✅ Coolify is healthy!"
              break
            fi
            echo "Waiting for Coolify to be healthy... ($i/30)"
            sleep 2
          done
      
      - name: Fix storage permissions
        run: |
          echo "🔧 Fixing storage and bootstrap permissions..."
          docker compose -f docker-compose.external.yml exec -T --user root coolify bash -c '
            chown -R www-data:www-data /var/www/html/storage
            chown -R www-data:www-data /var/www/html/bootstrap/cache
            chmod -R 775 /var/www/html/storage
            chmod -R 775 /var/www/html/bootstrap/cache
            mkdir -p /var/www/html/storage/app/ssh/keys
            mkdir -p /var/www/html/storage/logs
            chown -R www-data:www-data /var/www/html/storage/app/ssh
            chown -R www-data:www-data /var/www/html/storage/logs
          ' || echo "⚠️ Some permission fixes failed, continuing..."
          echo "✅ Permissions fixed"
      
      - name: Run database migrations
        run: |
          echo "🔄 Running database migrations..."
          docker compose -f docker-compose.external.yml exec -T coolify php artisan migrate --force
          echo "✅ Migrations complete"
      
      - name: Check application status
        run: |
          echo "Verifying application is ready..."
          for i in {1..10}; do
            if curl -sf http://localhost:8000/register > /dev/null; then
              echo "✅ Application is ready! Registration page is accessible."
              break
            fi
            echo "Waiting for application... ($i/10)"
            sleep 2
          done
      
      - name: Setup Cloudflare Quick Tunnel
        id: tunnel
        run: |
          echo "🌐 Setting up Cloudflare Quick Tunnel..."
          
          # Install cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          # Start quick tunnel in background and capture output
          cloudflared tunnel --url http://localhost:8000 > /tmp/tunnel.log 2>&1 &
          TUNNEL_PID=$!
          
          echo "Waiting for tunnel URL..."
          sleep 15
          
          # Extract the tunnel URL from logs
          TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
          
          if [ -n "$TUNNEL_URL" ]; then
            echo "✅ Cloudflare Quick Tunnel started!"
            echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT
            echo ""
            echo "=========================================="
            echo "🎉 Your Coolify instance is now public!"
            echo "=========================================="
            echo ""
            echo "Public URL: $TUNNEL_URL"
            echo ""
            echo "This is a temporary Quick Tunnel URL that:"
            echo "  • Requires no Cloudflare account"
            echo "  • Works immediately"
            echo "  • Is active for the duration of this workflow"
            echo "  • Changes each time you run the workflow"
            echo ""
            echo "=========================================="
          else
            echo "⚠️ Could not extract tunnel URL, but tunnel may still be running"
            cat /tmp/tunnel.log
            # Set a fallback URL
            TUNNEL_URL="http://localhost:8000"
            echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT
          fi
      
      - name: Update APP_URL with Tunnel URL
        if: steps.tunnel.outputs.tunnel_url != '' && steps.tunnel.outputs.tunnel_url != 'http://localhost:8000'
        run: |
          echo "🔄 Updating APP_URL in .env with Quick Tunnel URL..."
          
          # Update APP_URL in the .env file
          sed -i "s|APP_URL=.*|APP_URL=${{ steps.tunnel.outputs.tunnel_url }}|" .env.production.custom
          
          echo "✅ Updated APP_URL to: ${{ steps.tunnel.outputs.tunnel_url }}"
          
          # Copy updated .env into the container
          docker compose -f docker-compose.external.yml cp .env.production.custom coolify:/var/www/html/.env.production.custom
          
          # Restart the container to pick up the new URL
          echo "🔄 Restarting Coolify to apply new APP_URL..."
          docker compose -f docker-compose.external.yml restart coolify
          
          # Wait for it to be healthy again
          echo "Waiting for Coolify to restart..."
          sleep 20
          
          for i in {1..20}; do
            if curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "✅ Coolify restarted successfully with new URL!"
              break
            fi
            echo "Waiting for Coolify... ($i/20)"
            sleep 2
          done
      
      - name: Verify configuration
        run: |
          echo "📋 Verifying .env configuration..."
          echo ""
          echo "Database URL from .env:"
          grep "^DATABASE_URL=" .env.production.custom || echo "Not found!"
          echo ""
          echo "Redis URL from .env:"
          grep "^REDIS_URL=" .env.production.custom || echo "Not found!"
          echo ""
          echo "APP_URL from .env:"
          grep "^APP_URL=" .env.production.custom || echo "Not found!"
          echo ""
      
      - name: Display connection info
        run: |
          echo "================================================"
          echo "🎉 Coolify Deployment Complete!"
          echo "================================================"
          echo ""
          echo "Branch: ${{ inputs.branch }}"
          echo ""
          echo "📊 Services Status:"
          docker compose -f docker-compose.external.yml ps
          echo ""
          echo "🗄️ Local PostgreSQL:"
          echo "  • Host: localhost:5432"
          echo "  • Database: coolify"
          echo "  • User: coolify"
          echo "  • Status: ✅ Running"
          echo ""
          echo "📦 Local Redis:"
          echo "  • Host: localhost:6379"
          echo "  • Status: ✅ Running"
          echo ""
          echo "🌐 Access URLs:"
          echo "  • Local: http://localhost:8000"
          if [ -n "${{ steps.tunnel.outputs.tunnel_url }}" ]; then
            echo "  • Public (Quick Tunnel): ${{ steps.tunnel.outputs.tunnel_url }}"
          fi
          echo ""
          echo "Health Check:"
          curl -s http://localhost:8000/api/health || echo "Health check failed"
          echo ""
          echo ""
          echo "📝 Next Steps:"
          echo "1. Visit the public URL above to access Coolify"
          echo "2. Go to /register to create your account"
          echo "3. After registration, you'll be redirected to the dashboard"
          echo "4. Start deploying your applications!"
          echo ""
          echo "⚠️  Note: The Quick Tunnel URL is temporary and will"
          echo "    change each time you run this workflow."
          echo ""
          echo "================================================"
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Showing logs..."
          echo ""
          echo "=== Coolify Logs ==="
          docker compose -f docker-compose.external.yml logs coolify | tail -100
          echo ""
          echo "=== Soketi Logs ==="
          docker compose -f docker-compose.external.yml logs soketi | tail -50
          echo ""
          echo "=== Tunnel Logs ==="
          cat /tmp/tunnel.log || echo "No tunnel logs available"
      
      - name: Keep workflow running
        run: |
          echo "🔄 Workflow will keep running to maintain the deployment..."
          echo "The deployment will stay active for the duration of this workflow run."
          echo "To stop the deployment, cancel this workflow run."
          echo ""
          
          if [ -n "${{ steps.tunnel.outputs.tunnel_url }}" ]; then
            echo "Your Coolify instance is accessible at:"
            echo "${{ steps.tunnel.outputs.tunnel_url }}"
            echo ""
          fi
          
          # Keep the workflow alive and monitor health
          while true; do
            if ! curl -sf http://localhost:8000/api/health > /dev/null; then
              echo "❌ Coolify health check failed!"
              exit 1
            fi
            
            TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
            echo "✅ [$TIMESTAMP] Coolify is running"
            
            if [ -n "${{ steps.tunnel.outputs.tunnel_url }}" ]; then
              echo "   Public URL: ${{ steps.tunnel.outputs.tunnel_url }}"
            fi
            
            sleep 60
          done
