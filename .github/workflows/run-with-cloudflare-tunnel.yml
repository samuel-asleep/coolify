name: Run Coolify with Cloudflare Quick Tunnel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'v4.x'
        type: string
      tunnel_duration:
        description: 'How long to keep tunnel alive (minutes)'
        required: false
        default: '30'
        type: number
  push:
    branches:
      - main
      - develop
      - next

permissions:
  contents: read

jobs:
  run-and-expose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}
          persist-credentials: false

      - name: Set up environment file
        run: |
          cp .env.development.example .env
          # Generate APP_KEY
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env
          # Update DB_HOST for docker network
          sed -i 's/DB_HOST=host.docker.internal/DB_HOST=postgres/g' .env
          # Add missing environment variables
          cat >> .env << 'EOF'
          PUSHER_HOST=soketi
          PUSHER_PORT=6001
          PUSHER_SCHEME=http
          REDIS_HOST=redis
          REDIS_PORT=6379
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          EOF
          echo "✅ Environment file configured"

      - name: Install PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader
          echo "✅ Composer dependencies installed"

      - name: Build Docker images
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build coolify soketi
          echo "✅ Docker images built"

      - name: Start services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis minio
          echo "Waiting for services to be healthy..."
          # Wait for services with health checks
          for i in {1..30}; do
            if docker compose -f docker-compose.yml -f docker-compose.dev.yml ps | grep -q "(healthy)"; then
              echo "✅ Database services are healthy"
              break
            fi
            echo "Waiting for services to become healthy... ($i/30)"
            sleep 2
          done
          docker compose -f docker-compose.yml -f docker-compose.dev.yml ps

      - name: Start Coolify application
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d coolify soketi
          echo "Waiting for Coolify to start..."
          # Wait for Coolify health check
          for i in {1..60}; do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "✅ Coolify is healthy and ready"
              break
            fi
            echo "Waiting for Coolify health check... ($i/60)"
            sleep 2
          done

      - name: Check service status
        run: |
          docker compose -f docker-compose.yml -f docker-compose.dev.yml ps
          echo "Checking Coolify logs..."
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs coolify | tail -30

      - name: Run migrations and seed database
        run: |
          echo "Running migrations and seeders..."
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T coolify php artisan migrate --force --seed || {
            echo "Migration failed, checking logs..."
            docker compose -f docker-compose.yml -f docker-compose.dev.yml logs coolify | tail -50
            exit 1
          }
          echo "✅ Database setup complete"

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          # Download and install cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared --version

      - name: Start Cloudflare Quick Tunnel
        run: |
          # Start cloudflared tunnel in background and capture the URL
          echo "Starting Cloudflare Quick Tunnel..."
          nohup cloudflared tunnel --url http://localhost:8000 > tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "TUNNEL_PID=${TUNNEL_PID}" >> $GITHUB_ENV
          
          # Wait for tunnel to establish and get URL with retry logic
          echo "Waiting for tunnel to establish..."
          TUNNEL_URL=""
          for i in {1..30}; do
            TUNNEL_URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || echo "")
            if [ ! -z "$TUNNEL_URL" ]; then
              echo "✅ Tunnel established successfully"
              break
            fi
            echo "Waiting for tunnel URL... ($i/30)"
            sleep 2
          done
          
          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to get tunnel URL after 60 seconds, checking logs..."
            cat tunnel.log
            exit 1
          fi
          
          echo "TUNNEL_URL=${TUNNEL_URL}" >> $GITHUB_ENV
          echo "✅ Coolify is now accessible at: ${TUNNEL_URL}"
          echo "::notice title=Cloudflare Tunnel URL::${TUNNEL_URL}"

      - name: Display access information
        run: |
          echo "================================================"
          echo "🚀 Coolify is running and accessible via Cloudflare Quick Tunnel!"
          echo "================================================"
          echo ""
          echo "🌐 Public URL: ${{ env.TUNNEL_URL }}"
          echo "🔐 Default Login: test@example.com"
          echo "🔑 Default Password: password"
          echo "🌿 Branch: ${{ inputs.branch || github.ref_name }}"
          echo ""
          echo "================================================"
          echo ""
          echo "The application will remain accessible for ${{ inputs.tunnel_duration || 30 }} minutes."

      - name: Keep tunnel alive
        run: |
          DURATION=${{ inputs.tunnel_duration || 30 }}
          echo "Keeping tunnel alive for ${DURATION} minutes..."
          echo "You can access Coolify at: ${{ env.TUNNEL_URL }}"
          
          CURRENT_TUNNEL_PID=${{ env.TUNNEL_PID }}
          
          # Keep the tunnel alive and periodically check status
          for i in $(seq 1 ${DURATION}); do
            echo "[$i/${DURATION}] Tunnel still active at: ${{ env.TUNNEL_URL }}"
            sleep 60
            
            # Check if tunnel process is still running
            if ! kill -0 ${CURRENT_TUNNEL_PID} 2>/dev/null; then
              echo "Tunnel process died, restarting..."
              nohup cloudflared tunnel --url http://localhost:8000 > tunnel.log 2>&1 &
              CURRENT_TUNNEL_PID=$!
              sleep 5
              echo "Tunnel restarted with PID: ${CURRENT_TUNNEL_PID}"
            fi
          done

      - name: Cleanup
        if: always()
        run: |
          echo "Shutting down..."
          if [ ! -z "${{ env.TUNNEL_PID }}" ]; then
            kill ${{ env.TUNNEL_PID }} 2>/dev/null || true
          fi
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v
          echo "✅ Cleanup complete"

      - name: Show tunnel logs
        if: always()
        run: |
          if [ -f tunnel.log ]; then
            echo "Cloudflare Tunnel logs:"
            cat tunnel.log
          fi

      - name: Show application logs
        if: always()
        run: |
          echo "Coolify application logs:"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs coolify | tail -100
