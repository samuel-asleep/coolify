name: Deploy with Quick Tunnel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        type: string
      app_port:
        description: "App port"
        required: false
        default: "3000"
        type: string
      health_path:
        description: "Health path"
        required: false
        default: "/health"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node (if needed)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Start Postgres + Redis (local via docker compose)
        run: |
          set -euo pipefail
          cat > docker-compose.quicktunnel.yml <<'EOF'
          services:
            postgres:
              image: postgres:16-alpine
              ports: ["5432:5432"]
              environment:
                POSTGRES_USER: app
                POSTGRES_PASSWORD: app
                POSTGRES_DB: app
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U app -d app"]
                interval: 5s
                timeout: 3s
                retries: 20
            redis:
              image: redis:7-alpine
              ports: ["6379:6379"]
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 3s
                retries: 20
          EOF

          docker compose -f docker-compose.quicktunnel.yml up -d

          echo "Waiting for DB/Redis..."
          for i in {1..40}; do
            pg=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.quicktunnel.yml ps -q postgres)" 2>/dev/null || echo starting)
            rd=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.quicktunnel.yml ps -q redis)" 2>/dev/null || echo starting)
            echo "postgres=$pg redis=$rd"
            [ "$pg" = "healthy" ] && [ "$rd" = "healthy" ] && break
            sleep 3
          done
          [ "$pg" = "healthy" ] && [ "$rd" = "healthy" ] || (docker compose -f docker-compose.quicktunnel.yml logs && exit 1)

          echo "DATABASE_URL=postgresql://app:app@localhost:5432/app" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "PORT=${{ inputs.app_port }}" >> $GITHUB_ENV

      - name: Install deps (Node only)
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Migrate (optional)
        if: hashFiles('package.json') != ''
        run: |
          if npm run -s | grep -qE '(^|\s)(migrate|db:migrate)\b'; then
            npm run -s migrate || npm run -s db:migrate
          else
            echo "No migrate script found, skipping"
          fi

      - name: Start app (Node only)
        if: hashFiles('package.json') != ''
        run: |
          set -e
          if npm run -s | grep -qE '(^|\s)start\b'; then
            nohup npm start > app.log 2>&1 &
          else
            nohup npm run dev > app.log 2>&1 &
          fi
          echo $! > app.pid
          tail -n 20 app.log || true

      - name: Wait for local health
        run: |
          set -e
          url="http://localhost:${{ inputs.app_port }}${{ inputs.health_path }}"
          echo "Checking $url"
          for i in {1..60}; do
            if curl -fsS "$url" >/dev/null; then
              echo "Healthy ✅"
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ]; then tail -n 30 app.log || true; fi
            sleep 2
          done
          echo "App not healthy ❌"
          cat app.log || true
          exit 1

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared --version

      - name: Start Quick Tunnel + verify
        run: |
          set -e
          nohup cloudflared tunnel --url "http://localhost:${{ inputs.app_port }}" > tunnel.log 2>&1 &
          echo $! > tunnel.pid

          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done

          [ -n "${TUNNEL_URL:-}" ] || (echo "No tunnel URL"; cat tunnel.log; exit 1)

          echo "Public URL: $TUNNEL_URL"
          echo "Health:     $TUNNEL_URL${{ inputs.health_path }}"

          for i in {1..10}; do
            if curl -fsS "$TUNNEL_URL${{ inputs.health_path }}" >/dev/null; then
              echo "Public check OK ✅"
              exit 0
            fi
            sleep 3
          done

          echo "Public check failed ❌"
          tail -n 80 app.log || true
          tail -n 80 tunnel.log || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          kill "$(cat tunnel.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat app.pid 2>/dev/null)" 2>/dev/null || true
          docker compose -f docker-compose.quicktunnel.yml down -v 2>/dev/null || true
