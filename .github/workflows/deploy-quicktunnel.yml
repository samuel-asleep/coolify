name: Deploy with Quick Tunnel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        type: string
      app_port:
        description: Laravel app port
        required: false
        default: '3000'
        type: string
      health_path:
        description: Health check path (use auto to detect)
        required: false
        default: 'auto'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Detect health path
        id: health
        shell: bash
        run: |
          set -euo pipefail

          requested='${{ inputs.health_path }}'
          if [ "$requested" != "auto" ]; then
            health_path="$requested"
          elif rg -n "Route::get\('/health'" routes/api.php >/dev/null 2>&1; then
            health_path="/api/health"
          elif rg -n "Route::get\('/up'|Route::view\('/up'" routes >/dev/null 2>&1; then
            health_path="/up"
          else
            health_path="/"
          fi

          echo "health_path=$health_path" >> "$GITHUB_OUTPUT"
          echo "Using health path: $health_path"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, json, pdo_pgsql, pgsql, redis, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Start Postgres + Redis with docker compose
        shell: bash
        run: |
          set -euo pipefail

          cat > docker-compose.quicktunnel.yml <<'EOF'
          services:
            postgres:
              image: postgres:16-alpine
              ports:
                - "5432:5432"
              environment:
                POSTGRES_USER: app
                POSTGRES_PASSWORD: app
                POSTGRES_DB: app
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U app -d app"]
                interval: 5s
                timeout: 3s
                retries: 30
            redis:
              image: redis:7-alpine
              ports:
                - "6379:6379"
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 3s
                retries: 30
          EOF

          docker compose -f docker-compose.quicktunnel.yml up -d

          for i in {1..60}; do
            pg_container="$(docker compose -f docker-compose.quicktunnel.yml ps -q postgres)"
            rd_container="$(docker compose -f docker-compose.quicktunnel.yml ps -q redis)"
            pg="$(docker inspect -f '{{.State.Health.Status}}' "$pg_container" 2>/dev/null || echo starting)"
            rd="$(docker inspect -f '{{.State.Health.Status}}' "$rd_container" 2>/dev/null || echo starting)"

            echo "Attempt $i/60: postgres=$pg redis=$rd"
            if [ "$pg" = "healthy" ] && [ "$rd" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          if [ "$pg" != "healthy" ] || [ "$rd" != "healthy" ]; then
            docker compose -f docker-compose.quicktunnel.yml logs
            exit 1
          fi

          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=5432"
            echo "DB_DATABASE=app"
            echo "DB_USERNAME=app"
            echo "DB_PASSWORD=app"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
            echo "CACHE_DRIVER=redis"
            echo "QUEUE_CONNECTION=redis"
            echo "SESSION_DRIVER=redis"
          } >> "$GITHUB_ENV"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install JS dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Prepare Laravel app env
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            elif [ -f .env.development.example ]; then
              cp .env.development.example .env
            else
              cat > .env <<'EOF'
          APP_NAME=Coolify
          APP_ENV=local
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://127.0.0.1:${{ inputs.app_port }}
          LOG_CHANNEL=stack
          EOF
            fi
          fi

          php artisan key:generate --force

          {
            echo "DB_CONNECTION=${DB_CONNECTION}"
            echo "DB_HOST=${DB_HOST}"
            echo "DB_PORT=${DB_PORT}"
            echo "DB_DATABASE=${DB_DATABASE}"
            echo "DB_USERNAME=${DB_USERNAME}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "REDIS_HOST=${REDIS_HOST}"
            echo "REDIS_PORT=${REDIS_PORT}"
            echo "CACHE_DRIVER=${CACHE_DRIVER}"
            echo "QUEUE_CONNECTION=${QUEUE_CONNECTION}"
            echo "SESSION_DRIVER=${SESSION_DRIVER}"
          } >> .env

          php artisan config:clear
          php artisan cache:clear

      - name: Run migrations
        run: php artisan migrate --force

      - name: Start Laravel app
        shell: bash
        run: |
          set -euo pipefail
          nohup php artisan serve --host=0.0.0.0 --port='${{ inputs.app_port }}' > app.log 2>&1 &
          echo $! > app.pid
          sleep 2
          tail -n 40 app.log || true

      - name: Verify local health
        shell: bash
        run: |
          set -euo pipefail
          url="http://127.0.0.1:${{ inputs.app_port }}${{ steps.health.outputs.health_path }}"

          for i in {1..90}; do
            code="$(curl -sS -L -o /tmp/local-health.out -w '%{http_code}' "$url" || echo 000)"

            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "Local app is up (HTTP $code): $url"
              exit 0
            fi

            echo "Attempt $i/90 local health failed with HTTP $code"
            if [ $((i % 10)) -eq 0 ]; then
              tail -n 120 app.log || true
            fi
            sleep 2
          done

          echo "Local health check failed: $url"
          tail -n 200 app.log || true
          exit 1

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared --version

      - name: Start Quick Tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail

          nohup cloudflared tunnel --url "http://127.0.0.1:${{ inputs.app_port }}" > tunnel.log 2>&1 &
          echo $! > tunnel.pid

          tunnel_url=""
          for i in {1..60}; do
            tunnel_url="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)"
            if [ -n "$tunnel_url" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$tunnel_url" ]; then
            echo "Could not find trycloudflare URL in tunnel.log"
            tail -n 200 tunnel.log || true
            exit 1
          fi

          echo "tunnel_url=$tunnel_url" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_URL=$tunnel_url" >> "$GITHUB_ENV"

          echo "===================================================="
          echo "Quick Tunnel URL: $tunnel_url"
          echo "Health URL:       $tunnel_url${{ steps.health.outputs.health_path }}"
          echo "===================================================="

      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          url="${{ steps.tunnel.outputs.tunnel_url }}${{ steps.health.outputs.health_path }}"

          for i in {1..30}; do
            code="$(curl -sS -L -o /tmp/public-health.out -w '%{http_code}' "$url" || echo 000)"

            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "Public URL is up (HTTP $code): $url"
              exit 0
            fi

            echo "Attempt $i/30 public health failed with HTTP $code"
            sleep 2
          done

          echo "Public health check failed: $url"
          tail -n 200 app.log || true
          tail -n 200 tunnel.log || true
          exit 1

      - name: Keep tunnel alive for up to 10 minutes
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..20}; do
            if ! kill -0 "$(cat app.pid)" 2>/dev/null; then
              echo "Laravel process exited early"
              tail -n 200 app.log || true
              exit 1
            fi

            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
              echo "cloudflared process exited early"
              tail -n 200 tunnel.log || true
              tail -n 200 app.log || true
              exit 1
            fi

            echo "[$i/20] App and tunnel are alive. Public URL: ${{ steps.tunnel.outputs.tunnel_url }}"
            sleep 30
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          kill "$(cat tunnel.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat app.pid 2>/dev/null)" 2>/dev/null || true
          docker compose -f docker-compose.quicktunnel.yml down -v 2>/dev/null || true
