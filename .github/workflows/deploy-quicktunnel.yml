name: Deploy with Quick Tunnel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        type: string
      app_port:
        description: "Laravel app port"
        required: false
        default: "3000"
        type: string
      health_path:
        description: "Health check path"
        required: false
        default: "/"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, json, pdo_pgsql, pgsql, redis, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Start Postgres + Redis
        run: |
          set -euo pipefail

          cat > docker-compose.quicktunnel.yml <<'EOF'
          services:
            postgres:
              image: postgres:16-alpine
              ports: ["5432:5432"]
              environment:
                POSTGRES_USER: app
                POSTGRES_PASSWORD: app
                POSTGRES_DB: app
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U app -d app"]
                interval: 5s
                timeout: 3s
                retries: 20
            redis:
              image: redis:7-alpine
              ports: ["6379:6379"]
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 5s
                timeout: 3s
                retries: 20
          EOF

          docker compose -f docker-compose.quicktunnel.yml up -d

          echo "Waiting for DB/Redis..."
          for i in {1..40}; do
            pg=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.quicktunnel.yml ps -q postgres)")
            rd=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose -f docker-compose.quicktunnel.yml ps -q redis)")
            [ "$pg" = "healthy" ] && [ "$rd" = "healthy" ] && break
            sleep 3
          done

          echo "DATABASE_URL=postgresql://app:app@127.0.0.1:5432/app" >> $GITHUB_ENV
          echo "REDIS_URL=redis://127.0.0.1:6379/0" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          npm run build

      - name: Prepare Laravel
        run: |
          cp .env.example .env || true
          php artisan key:generate --force
          php artisan config:clear || true
          php artisan migrate --force

      - name: Start Laravel
        run: |
          nohup php artisan serve --host=0.0.0.0 --port=${{ inputs.app_port }} > app.log 2>&1 &
          echo $! > app.pid
          sleep 2

      - name: Wait for local health
        run: |
          for i in {1..60}; do
            if curl -fsS "http://127.0.0.1:${{ inputs.app_port }}${{ inputs.health_path }}" >/dev/null; then
              echo "App healthy ✅"
              exit 0
            fi
            sleep 2
          done
          echo "App failed health check ❌"
          cat app.log
          exit 1

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Quick Tunnel
        id: tunnel
        run: |
          nohup cloudflared tunnel --url "http://127.0.0.1:${{ inputs.app_port }}" > tunnel.log 2>&1 &
          echo $! > tunnel.pid

          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            [ -n "$TUNNEL_URL" ] && break
            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to get tunnel URL"
            cat tunnel.log
            exit 1
          fi

          echo "url=$TUNNEL_URL" >> $GITHUB_OUTPUT
          echo "Public URL: $TUNNEL_URL"

      - name: Verify public access
        run: |
          for i in {1..10}; do
            if curl -fsS "${{ steps.tunnel.outputs.url }}${{ inputs.health_path }}" >/dev/null; then
              echo "Public tunnel verified ✅"
              exit 0
            fi
            sleep 3
          done
          echo "Public verification failed ❌"
          exit 1

      - name: Keep app alive for 10 minutes
        run: |
          echo "App available at: ${{ steps.tunnel.outputs.url }}"
          echo "Keeping tunnel alive for 10 minutes..."
          sleep 600

      - name: Cleanup
        if: always()
        run: |
          kill "$(cat tunnel.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat app.pid 2>/dev/null)" 2>/dev/null || true
          docker compose -f docker-compose.quicktunnel.yml down -v 2>/dev/null || true
