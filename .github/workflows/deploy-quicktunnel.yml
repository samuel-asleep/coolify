name: Deploy with Quick Tunnel (30 Min Session)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        type: string
      app_port:
        description: "Laravel app port"
        required: false
        default: "8000"
        type: string
      health_path:
        description: "Health check path"
        required: false
        default: "/"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Increased timeout to allow for setup + 30 mins of runtime
    timeout-minutes: 45 

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, xml, ctype, json, pdo_pgsql, pgsql, redis, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Start Postgres + Redis
        run: |
          cat > docker-compose.quicktunnel.yml <<'EOF'
          services:
            postgres:
              image: postgres:16-alpine
              ports: ["5432:5432"]
              environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
            redis:
              image: redis:7-alpine
              ports: ["6379:6379"]
          EOF
          docker compose -f docker-compose.quicktunnel.yml up -d
          
          echo "DB_CONNECTION=pgsql" >> $GITHUB_ENV
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=5432" >> $GITHUB_ENV
          echo "DB_DATABASE=app" >> $GITHUB_ENV
          echo "DB_USERNAME=app" >> $GITHUB_ENV
          echo "DB_PASSWORD=app" >> $GITHUB_ENV

      - name: Install Deps & Build
        run: |
          composer install --no-interaction --prefer-dist
          npm ci
          npm run build

      - name: Prepare Laravel env
        run: |
          cp .env.example .env || touch .env
          php artisan key:generate --force
          {
            echo "DB_CONNECTION=pgsql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_DATABASE=app"
            echo "DB_USERNAME=app"
            echo "DB_PASSWORD=app"
          } >> .env

      - name: Migrate
        run: php artisan migrate --force

      - name: Start Laravel app
        run: |
          nohup php artisan serve --host=0.0.0.0 --port=${{ inputs.app_port }} > app.log 2>&1 &
          echo $! > app.pid
          sleep 3

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Quick Tunnel
        id: tunnel
        run: |
          nohup cloudflared tunnel --url "http://127.0.0.1:${{ inputs.app_port }}" > tunnel.log 2>&1 &
          echo $! > tunnel.pid
          
          # Extract URL
          for i in {1..30}; do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              echo "tunnel_url=$URL" >> $GITHUB_OUTPUT
              echo "### 🚀 App is Live!" >> $GITHUB_STEP_SUMMARY
              echo "URL: [$URL]($URL)" >> $GITHUB_STEP_SUMMARY
              echo "The session will stay active for 30 minutes." >> $GITHUB_STEP_SUMMARY
              break
            fi
            sleep 2
          done

      - name: Keep Alive (30 Minutes)
        run: |
          echo "App is running at ${{ steps.tunnel.outputs.tunnel_url }}"
          echo "Waiting 30 minutes before shutting down..."
          sleep 1800

      - name: Cleanup
        if: always()
        run: |
          kill "$(cat tunnel.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat app.pid 2>/dev/null)" 2>/dev/null || true
          docker compose -f docker-compose.quicktunnel.yml down -v 2>/dev/null || true
 
