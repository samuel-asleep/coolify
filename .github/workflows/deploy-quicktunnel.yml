name: Deploy with Local Services and Quick Tunnel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        type: string
      app_port:
        description: App port exposed on runner
        required: false
        default: '8000'
        type: string
      health_path:
        description: Health check path (auto, /api/health, /up, /register, /)
        required: false
        default: 'auto'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve health paths
        id: health
        shell: bash
        run: |
          set -euo pipefail

          requested='${{ inputs.health_path }}'
          if [ "$requested" != 'auto' ]; then
            primary_path="$requested"
          elif rg -n "Route::get\('/health'" routes/api.php >/dev/null 2>&1; then
            primary_path='/api/health'
          elif rg -n "Route::get\('/up'|Route::view\('/up'" routes >/dev/null 2>&1; then
            primary_path='/up'
          else
            primary_path='/register'
          fi

          fallback_paths="$primary_path,/api/health,/register,/,/up"
          echo "primary_path=$primary_path" >> "$GITHUB_OUTPUT"
          echo "fallback_paths=$fallback_paths" >> "$GITHUB_OUTPUT"

      - name: Prepare .env for dockerized startup
        shell: bash
        run: |
          set -euo pipefail

          if [ -f .env.development.example ]; then
            cp .env.development.example .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          APP_KEY="base64:$(openssl rand -base64 32)"

          {
            echo "APP_ENV=production"
            echo "APP_DEBUG=false"
            echo "APP_KEY=$APP_KEY"
            echo "APP_URL=http://localhost:${{ inputs.app_port }}"
            echo "APP_PORT=${{ inputs.app_port }}"
            echo 'DB_CONNECTION=pgsql'
            echo 'DB_HOST=postgres'
            echo 'DB_PORT=5432'
            echo 'DB_DATABASE=coolify'
            echo 'DB_USERNAME=coolify'
            echo 'DB_PASSWORD=password'
            echo 'REDIS_HOST=redis'
            echo 'REDIS_PORT=6379'
            echo 'QUEUE_CONNECTION=redis'
            echo 'SESSION_DRIVER=redis'
            echo 'CACHE_DRIVER=redis'
            echo 'PUSHER_APP_ID=coolify'
            echo 'PUSHER_APP_KEY=coolify'
            echo 'PUSHER_APP_SECRET=coolify'
            echo 'SOKETI_DEFAULT_APP_ID=coolify'
            echo 'SOKETI_DEFAULT_APP_KEY=coolify'
            echo 'SOKETI_DEFAULT_APP_SECRET=coolify'
          } >> .env

      - name: Build Coolify image
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.dev.yml build coolify soketi

      - name: Start stack (coolify, postgres, redis, soketi)
        shell: bash
        run: |
          set -euo pipefail
          APP_PORT='${{ inputs.app_port }}' docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis soketi coolify

      - name: Wait for local stack health
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a paths <<< '${{ steps.health.outputs.fallback_paths }}'

          for i in {1..90}; do
            for path in "${paths[@]}"; do
              code="$(curl -sS -L -o /tmp/local-health.out -w '%{http_code}' "http://127.0.0.1:${{ inputs.app_port }}${path}" || echo 000)"
              if [ "$code" != '000' ] && [ "$code" -lt 500 ]; then
                echo "Local app is up (HTTP $code): http://127.0.0.1:${{ inputs.app_port }}${path}"
                exit 0
              fi
              echo "Attempt $i/90 local path $path => HTTP $code"
            done

            if [ $((i % 10)) -eq 0 ]; then
              docker compose -f docker-compose.yml -f docker-compose.dev.yml ps
              docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=80 coolify || true
            fi
            sleep 2
          done

          echo 'Local health checks failed for all candidate paths.'
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=200 coolify || true
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=200 soketi || true
          exit 1

      - name: Run migrations in container
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.dev.yml exec -T coolify php artisan migrate --force

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared --version

      - name: Start Quick Tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail

          nohup cloudflared tunnel --url "http://127.0.0.1:${{ inputs.app_port }}" > tunnel.log 2>&1 &
          echo $! > tunnel.pid

          tunnel_url=''
          for i in {1..60}; do
            tunnel_url="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -n 1 || true)"
            if [ -n "$tunnel_url" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$tunnel_url" ]; then
            echo 'Could not find trycloudflare URL in tunnel.log.'
            tail -n 200 tunnel.log || true
            exit 1
          fi

          echo "tunnel_url=$tunnel_url" >> "$GITHUB_OUTPUT"
          echo '===================================================='
          echo "Quick Tunnel URL: $tunnel_url"
          echo "Primary Health URL: $tunnel_url${{ steps.health.outputs.primary_path }}"
          echo '===================================================='

      - name: Verify public health
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a paths <<< '${{ steps.health.outputs.fallback_paths }}'

          for i in {1..30}; do
            for path in "${paths[@]}"; do
              code="$(curl -sS -L -o /tmp/public-health.out -w '%{http_code}' "${{ steps.tunnel.outputs.tunnel_url }}${path}" || echo 000)"
              if [ "$code" != '000' ] && [ "$code" -lt 500 ]; then
                echo "Public URL is up (HTTP $code): ${{ steps.tunnel.outputs.tunnel_url }}${path}"
                exit 0
              fi
              echo "Attempt $i/30 public path $path => HTTP $code"
            done
            sleep 2
          done

          echo 'Public health checks failed for all candidate paths.'
          docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=200 coolify || true
          tail -n 200 tunnel.log || true
          exit 1

      - name: Keep tunnel alive for up to 10 minutes
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..20}; do
            if ! kill -0 "$(cat tunnel.pid)" 2>/dev/null; then
              echo 'cloudflared process exited early.'
              tail -n 200 tunnel.log || true
              docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=200 coolify || true
              exit 1
            fi

            if ! curl -sS -L -o /tmp/keepalive.out -w '%{http_code}' "http://127.0.0.1:${{ inputs.app_port }}${{ steps.health.outputs.primary_path }}" | awk '{exit !($1 != 0 && $1 < 500)}'; then
              echo 'Local health probe failed during keepalive.'
              docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --tail=200 coolify || true
              exit 1
            fi

            echo "[$i/20] Stack and tunnel are alive. Public URL: ${{ steps.tunnel.outputs.tunnel_url }}"
            sleep 30
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          kill "$(cat tunnel.pid 2>/dev/null)" 2>/dev/null || true
          docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v 2>/dev/null || true
